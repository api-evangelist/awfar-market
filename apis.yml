aid: awfar-market
name: Awfar Market
description: >-
  Awfar is a Cairo- and Riyadh-based digital solutions company (founded 2013) offering an
  integrated customer engagement and commerce platform. It combines an omnichannel Chat Center
  with AI agents (WhatsApp, Instagram, Facebook), a cloud Call Center, and a Commerce & Delivery
  platform for order, inventory, and logistics management within a single interface. Awfar serves
  more than 2,000 clients across retail, pharmacy, restaurant, e-commerce, tourism, healthcare,
  education, and real estate, and ships prebuilt integrations for Shopify, Meta, Odoo, Zid, and
  Salla plus custom API connections. Backed by 500 Global. No public developer portal or OpenAPI
  specification is published at this time; integration is arranged via the sales and demo channel.
